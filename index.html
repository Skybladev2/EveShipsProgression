<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVE Online — Ship Progression</title>
<meta name="description" content="Interactive progression chart of EVE Online ships, from tech-1 frigates up to capital ships.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<link rel="stylesheet" href="assets/style.css">
<!-- Vendored locally so the page does not depend on a CDN being reachable. -->
<script src="assets/vendor/mermaid.min.js"></script>
<script src="assets/vendor/svg-pan-zoom.min.js"></script>
<!-- Omega-only ships, classified offline from the EVE SDE. -->
<script src="assets/omega-ships.js"></script>
</head>
<body>
<header class="topbar">
  <h1><span class="dot"></span>EVE Online — Ship Progression</h1>
  <div class="tools">
    <div class="combo ship-select">
      <input id="ship-input" type="text" role="combobox" aria-expanded="false"
             aria-controls="ship-list" aria-autocomplete="list" autocomplete="off"
             spellcheck="false" placeholder="Select a ship…" aria-label="Select a ship">
      <ul id="ship-list" role="listbox" aria-label="Ships" hidden></ul>
    </div>
    <div class="combo edge-select">
      <input id="edge-input" type="text" role="combobox" aria-expanded="false"
             aria-controls="edge-list" aria-autocomplete="list" autocomplete="off"
             spellcheck="false" placeholder="Connection type…" aria-label="Filter by connection type">
      <ul id="edge-list" role="listbox" aria-label="Connection types" hidden></ul>
    </div>
    <div class="edge-mode" role="radiogroup" aria-label="What clicking an edge does">
      <label title="Clicking an edge narrows the chart to that connection type">
        <input type="radio" name="edge-mode" value="filter" checked>
        <span>Filter</span>
      </label>
      <label title="Clicking an edge only highlights that single link">
        <input type="radio" name="edge-mode" value="highlight">
        <span>Highlight</span>
      </label>
    </div>
    <div class="buttons">
      <button id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
      <button id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
      <button id="fit" title="Fit to screen">Fit</button>
      <button id="reset" title="Reset view">Reset</button>
      <button id="minimap-toggle" title="Show / hide the minimap" aria-pressed="true">Map</button>
      <button id="download" title="Download as SVG">SVG</button>
    </div>
  </div>
</header>

<main id="viewport">
  <div id="graph" aria-live="polite"><div class="loading">Loading diagram…</div></div>
  <!-- Overview of the whole chart with a draggable viewport box, so the wide
       diagram can be navigated without losing track of where you are. -->
  <div id="minimap" class="minimap" role="presentation">
    <svg id="minimap-svg" class="minimap-svg" preserveAspectRatio="none"
         aria-hidden="true" focusable="false"></svg>
  </div>
</main>

<footer class="statusbar">
  <span>Drag to pan · Scroll to zoom · Drag the minimap to jump around · Pick a ship to isolate its line or a connection type to filter the chart · Click an edge to highlight or filter by it</span>
  <span class="legend"><span class="legend-badge">Ω</span> requires an Omega clone</span>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
