<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVE Online — Ship Progression</title>
<meta name="description" content="Interactive progression chart of EVE Online ships, from tech-1 frigates up to capital ships.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<link rel="stylesheet" href="assets/style.css">
<!-- Vendored locally so the page does not depend on a CDN being reachable. -->
<script src="assets/vendor/mermaid.min.js"></script>
<script src="assets/vendor/svg-pan-zoom.min.js"></script>
</head>
<body>
<header class="topbar">
  <h1><span class="dot"></span>EVE Online — Ship Progression</h1>
  <div class="tools">
    <label class="search">
      <input id="search" type="search" placeholder="Find a ship…" autocomplete="off" spellcheck="false" aria-label="Find a ship">
    </label>
    <div class="buttons">
      <button id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
      <button id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
      <button id="fit" title="Fit to screen">Fit</button>
      <button id="reset" title="Reset view">Reset</button>
      <button id="download" title="Download as SVG">SVG</button>
    </div>
  </div>
</header>

<main id="viewport">
  <div id="graph" aria-live="polite"><div class="loading">Loading diagram…</div></div>
</main>

<footer class="statusbar">
  <span>Drag to pan · Scroll to zoom</span>
  <span id="status"></span>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
